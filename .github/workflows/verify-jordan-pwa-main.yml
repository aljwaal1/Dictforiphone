name: Verify Published Easy English AI PWA

on:
  push:
    branches: ["main"]
    paths:
      - "jordan/**"
      - ".github/workflows/verify-jordan-pwa-main.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: |
          node --check jordan/jordan-pwa.js
          node --check jordan/sw.js
      - name: Manifest JSON
        run: python3 -m json.tool jordan/manifest.webmanifest >/dev/null
      - name: Content regression checks
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('jordan/assets/data/words.json',encoding='utf-8'))
          assert d['app']=='Easy English AI'
          assert d['version']==4
          w=d['words']
          assert len(w)==1350
          assert not any(str(x.get('grade','')).upper()=='KG' for x in w)
          starter=sum(1 for x in w if x.get('grade')=='1' and x.get('semester')=='تمهيدي')
          assert starter>=90
          for term in ['apple','school','teacher','classroom','morning','sentence']:
              assert any(str(x.get('word_en','')).lower()==term for x in w), term
          PY
          grep -q "load().then(render)" jordan/jordan-pwa.js
          grep -q "easy_english_ai_pwa_v3" jordan/jordan-pwa.js
          grep -q "LEGACY_KEYS" jordan/jordan-pwa.js
      - name: Unified runtime and v354 identity
        run: |
          grep -q 'jordan-pwa.js?v=354' jordan/index.html
          test "$(grep -c '<script src=' jordan/index.html)" -eq 1
          ! grep -q 'app.js' jordan/index.html
          ! grep -q 'v2-learning.js' jordan/index.html
          ! grep -q 'easy-english-v344.js' jordan/index.html
          ! grep -q 'easy-english-v345-patch.js' jordan/index.html
          grep -q "easy-english-ai-pwa-v354-book-translation" jordan/sw.js
          grep -q "jordan-pwa.js?v=354" jordan/sw.js
          grep -Fq "serviceWorker.register('./sw.js?v=354-book-translation-1'" jordan/index.html
          grep -q 'manifest.webmanifest?v=354' jordan/index.html
      - name: iPhone enrichment and PDF checks
        run: |
          grep -q "easy_english_ai_enrichment_v1" jordan/jordan-pwa.js
          grep -q "indexedDB.open" jordan/jordan-pwa.js
          grep -q "navigator.hardwareConcurrency" jordan/jordan-pwa.js
          grep -q "dictionaryapi.dev" jordan/jordan-pwa.js
          grep -q "mymemory.translated.net" jordan/jordan-pwa.js
          grep -q "async function extractPdf(file,onPage,onProgress)" jordan/jordan-pwa.js
          grep -q "await pdf.destroy" jordan/jordan-pwa.js
          grep -q "requestIdleCallback" jordan/jordan-pwa.js
          grep -q "function shouldSkipForGrade" jordan/jordan-pwa.js
          grep -q "\['1','2','3'\].includes" jordan/jordan-pwa.js
          test "$(grep -c '^async function extractPdf' jordan/jordan-pwa.js)" -eq 1
      - name: Book translation checks
        run: |
          grep -q 'ترجمة كتاب' jordan/jordan-pwa.js
          grep -q 'الكلمات ومعانيها' jordan/jordan-pwa.js
          grep -q 'الجمل ومعانيها' jordan/jordan-pwa.js
          grep -q 'function bookTranslate()' jordan/jordan-pwa.js
          grep -q 'function translateBookRun(mode)' jordan/jordan-pwa.js
          grep -q "page==='booktranslate'" jordan/jordan-pwa.js
          test "$(grep -c '^function render()' jordan/jordan-pwa.js)" -eq 1
      - name: Existing learning regression checks
        run: |
          grep -q 'بطاقات سريعة' jordan/jordan-pwa.js
          grep -q 'اختبار AI متكيف' jordan/jordan-pwa.js
          grep -q 'مراجعة AI' jordan/jordan-pwa.js
          grep -q 'حسب الدرس' jordan/jordan-pwa.js
          grep -q 'الكلمات الصعبة فقط' jordan/jordan-pwa.js
          grep -q 'أخطائي الأخيرة' jordan/jordan-pwa.js
          grep -q 'غير المتقنة فقط' jordan/jordan-pwa.js
          grep -q 'مختلط ذكي' jordan/jordan-pwa.js
          grep -q 'إعادة الأخطاء فقط' jordan/jordan-pwa.js
          grep -q 'profileProgress' jordan/jordan-pwa.js
