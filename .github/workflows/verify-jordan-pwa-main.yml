name: Verify Published Easy English AI PWA

on:
  push:
    branches: ["main"]
    paths:
      - "jordan/**"
      - ".github/workflows/verify-jordan-pwa-main.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: |
          node --check jordan/jordan-pwa.js
          node --check jordan/sw.js
      - name: Manifest JSON
        run: python3 -m json.tool jordan/manifest.webmanifest >/dev/null
      - name: Content regression checks
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('jordan/assets/data/words.json',encoding='utf-8'))
          assert d['app']=='Easy English AI'
          assert d['version']==4
          w=d['words']
          assert len(w)==1350, len(w)
          assert not any(str(x.get('grade','')).upper()=='KG' for x in w)
          assert not any('Jordanian curriculum starter set' in str(x) for x in w)
          starter=sum(1 for x in w if x.get('grade')=='1' and x.get('semester')=='تمهيدي')
          assert starter>=90, starter
          grades={str(x.get('grade','')) for x in w}
          assert grades.issubset(set(map(str,range(1,13)))), grades
          for term in ['apple','school','teacher','classroom','morning','sentence']:
              assert any(str(x.get('word_en','')).lower()==term for x in w), term
          print('live content ok',len(w),sorted(grades),'starter',starter)
          PY
          grep -q "load().then(render)" jordan/jordan-pwa.js
          grep -q "easy_english_ai_pwa_v3" jordan/jordan-pwa.js
          grep -q "LEGACY_KEYS" jordan/jordan-pwa.js
      - name: One UI runtime only
        run: |
          grep -q 'jordan-pwa.js?v=353' jordan/index.html
          test "$(grep -c '<script src=' jordan/index.html)" -eq 1
          ! grep -q 'app.js' jordan/index.html
          ! grep -q 'v2-learning.js' jordan/index.html
          ! grep -q 'excel-import-v14.js' jordan/index.html
          ! grep -q 'backup-tools.js' jordan/index.html
          ! grep -q 'import-refresh.js' jordan/index.html
          ! grep -q 'ios-fixes.js' jordan/index.html
          ! grep -q 'sentence-display-v15.js' jordan/index.html
          ! grep -q 'easy-english-v344.js' jordan/index.html
          ! grep -q 'easy-english-v345-patch.js' jordan/index.html
      - name: Advanced learning regression checks
        run: |
          grep -q 'بطاقات سريعة' jordan/jordan-pwa.js
          grep -q 'اختبار AI متكيف' jordan/jordan-pwa.js
          grep -q 'مراجعة AI' jordan/jordan-pwa.js
          grep -q 'حسب ترتيب ظهور الكلمات في PDF' jordan/jordan-pwa.js
          grep -q 'حسب الوحدة' jordan/jordan-pwa.js
          grep -q 'حسب الدرس' jordan/jordan-pwa.js
          grep -q 'الكلمات الصعبة فقط' jordan/jordan-pwa.js
          grep -q 'أخطائي الأخيرة' jordan/jordan-pwa.js
          grep -q 'غير المتقنة فقط' jordan/jordan-pwa.js
          grep -q 'مختلط ذكي' jordan/jordan-pwa.js
          grep -q 'إعادة الأخطاء فقط' jordan/jordan-pwa.js
          grep -q 'profileProgress' jordan/jordan-pwa.js
          grep -q 'lastIndexByGrade' jordan/jordan-pwa.js
          test "$(grep -c '^function learningPool' jordan/jordan-pwa.js)" -eq 1
          test "$(grep -c '^function learningHeader' jordan/jordan-pwa.js)" -eq 1
      - name: PDF and book studio checks
        run: |
          grep -q 'استوديو AI للكتاب' jordan/jordan-pwa.js
          grep -q 'accept="application/pdf"' jordan/jordan-pwa.js
          grep -q 'async function extractPdf' jordan/jordan-pwa.js
          grep -q 'function saveCandidates' jordan/jordan-pwa.js
          cp jordan/jordan-pwa.js /tmp/jordan-pwa.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('/tmp/jordan-pwa.js').read_text(encoding='utf-8')
          stop=re.search(r"const STOP=new Set\(\('([^']*)'\)\.split\(' '\)\);",s)
          proper=re.search(r"const PROPER=new Set\(\('([^']*)'\)\.split\(' '\)\);",s)
          assert stop and proper
          STOP=set(stop.group(1).split()); PROPER=set(proper.group(1).split())
          def valid(w):
              l=w.lower()
              return bool(re.fullmatch(r"[A-Za-z][A-Za-z'-]*",w)) and 2<=len(l)<=32 and l not in STOP and re.sub(r"[-']",'',l) not in PROPER
          for w in ['school','classroom','great','happy','beautiful','learn','teacher','difficult','morning','you','have','can']:
              assert valid(w), w
          for w in ['and','with','from','Jordan','Amman','Ahmed']:
              assert not valid(w), w
          assert 'pdf.min.mjs' not in s
          assert s.count('pdf.min.js') == 1
          assert 'const key=raw.toLowerCase();' in s
          assert 'const list=[...map.values()];' in s
          print('live functional PDF regression ok')
          PY
      - name: Cache isolation and identity
        run: |
          grep -q "easy-english-ai-pwa-v353-unified" jordan/sw.js
          grep -q "jordan-pwa.js?v=353" jordan/sw.js
          ! grep -q 'app.js' jordan/sw.js
          ! grep -q 'v2-learning.js' jordan/sw.js
          ! grep -q 'easy-english-v344.js' jordan/sw.js
          ! grep -q 'easy-english-v345-patch.js' jordan/sw.js
          grep -q "CLEAR_OLD_CACHES" jordan/sw.js
          grep -q "updateViaCache: 'none'" jordan/index.html
          grep -q "reg.update()" jordan/index.html
          grep -Fq "serviceWorker.register('./sw.js?v=353-unified-1'" jordan/index.html
          grep -q 'manifest.webmanifest?v=353' jordan/index.html
          grep -q 'Easy English AI' jordan/index.html
          grep -q 'Easy English AI' jordan/manifest.webmanifest
          grep -q '"start_url": "./"' jordan/manifest.webmanifest
          grep -q '"id": "./"' jordan/manifest.webmanifest
