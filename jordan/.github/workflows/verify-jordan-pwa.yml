name: Verify Jordan PWA

on:
  push:
    branches: ["jordan-school-dictionary"]
  pull_request:
    branches: ["jordan-school-dictionary"]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check jordan-pwa.js
          node --check app.js
          node --check v2-learning.js
          node --check excel-import-v14.js
          node --check backup-tools.js
          node --check import-refresh.js
          node --check ios-fixes.js
          node --check sentence-display-v15.js
          node --check sw.js
      - name: Manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('manifest ok')"
      - name: Required files and references
        run: |
          test -s index.html
          test -s jordan-pwa.js
          test -s jordan-pwa.css
          test -s manifest.webmanifest
          test -s sw.js
          grep -q 'jordan-pwa.css' index.html
          grep -q 'jordan-pwa.js' index.html
          grep -q 'manifest.webmanifest' index.html
          grep -q 'jordan-pwa.js' sw.js
          grep -q 'jordan-pwa.css' sw.js
      - name: PWA requirements
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('manifest.webmanifest','utf8'));
          if(m.display!=='standalone') throw new Error('display must be standalone');
          if(!m.start_url) throw new Error('start_url missing');
          if(!Array.isArray(m.icons)||m.icons.length<2) throw new Error('icons missing');
          const h=fs.readFileSync('index.html','utf8');
          if(!/apple-mobile-web-app-capable/i.test(h)) throw new Error('iPhone PWA meta missing');
          if(!/viewport-fit=cover/i.test(h)) throw new Error('safe-area viewport missing');
          console.log('PWA requirements ok');
          NODE
